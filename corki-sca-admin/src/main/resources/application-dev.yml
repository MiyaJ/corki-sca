# 日志配置
#logging:
#  level:
#    root: debug
logging:
  level:
    com.corki: debug
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

spring:
  application:
    name: corki-sca-admin
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: public
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        namespace: public
  config:
    import:
      - optional:nacos:${spring.application.name}
      - optional:nacos:web-common
      - optional:nacos:mysql
      - optional:nacos:redis

rocketmq:
  # NameServer 地址（V4 客户端）
  name-server: 127.0.0.1:9876

  # 生产者配置
  producer:
    group: my_producer_group_test          # 生产者组名（必填，修改为测试组名）
    send-msg-timeout: 10000            # 发送超时时间（毫秒，增加到 10 秒）
    max-message-size: 4194304         # 消息最大大小（默认 4MB）
    retry-times-when-send-failed: 2   # 发送失败重试次数
    compress-msg-body-over-howmuch: 4096  # 消息压缩阈值
    vip-channel-enabled: false        # VIPChannel 开关（Windows 必须关闭）

  # 消费者配置
  consumer:
    group: my_consumer_group_test
    consume-thread-min: 5
    consume-thread-max: 10

  # ACL 权限控制（可选，阿里云 RocketMQ 需要）
  # access-key: your-access-key
  # secret-key: your-secret-key